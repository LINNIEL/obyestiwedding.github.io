<!DOCTYPE html>
<html>
<head>
<title>Generator Link Undangan</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <div class="background"></div>

    <div class="container">

        <h3>Generator Link Undangan</h3>

        <p class="text-center text-dark">
            Masukkan daftar nama (1 nama per baris)
        </p>

        <textarea
            id="daftarNama"
            placeholder="Contoh:
            Nama & Marga
            Nama & Pasangan
            Nama & Marga
            Nama & Pasangan"></textarea>

        <button class="generate" onclick="buatLink()">
            Generate Link
        </button>

        <div id="hasil"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
